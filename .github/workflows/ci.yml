name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Alleen nodig voor `prisma generate`/`validate`, die een geldige
      # (niet per se bereikbare) datasource-URL vereisen om het schema te
      # kunnen parsen. Geen live database nodig voor deze CI-stappen.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/bvc_rapportage_ci?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @bvc/db generate

      - name: Validate Prisma schema
        run: pnpm --filter @bvc/db validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
